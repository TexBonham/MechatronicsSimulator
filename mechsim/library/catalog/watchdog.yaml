# Heartbeat watchdog. Numeric part values are placeholders.
types:
  - name: watchdog
    version: 1.0.0
    category: safety
    description: >-
      Power-and-safety watchdog: opens its output contacts, and so de-energises the rail it gates, when no heartbeat
      edge arrives within the timeout. The gated rail is the one whose gated_by lists the instance.
    parameters:
      - name: mass
        dimension: "[mass]"
        minimum: "0 kg"
      - name: timeout
        dimension: "[time]"
        minimum: "0 s"
      - name: cutoff_delay
        dimension: "[time]"
        minimum: "0 s"
      - name: input_voltage
        dimension: "[mass] * [length] ** 2 / [time] ** 3 / [current]"
        minimum: "0 V"
      - name: contact_voltage
        dimension: "[mass] * [length] ** 2 / [time] ** 3 / [current]"
        minimum: "0 V"
      - name: contact_current
        dimension: "[current]"
        minimum: "0 A"
      - name: manual_reset
        kind: flag
        default: false
    tiers:
      - name: behavioral
        parameters: [mass, timeout, cutoff_delay, input_voltage, contact_voltage, contact_current, manual_reset]
    mechanical:
      mass:
        source: parameter
        parameter: mass
      mounts:
        - name: din_rail
          kind: clamp
          offset: ["0 mm", "0 mm", "0 mm"]
    electrical:
      pins:
        - name: heartbeat
          direction: input
          signal_kind: digital
          voltage_rating: input_voltage
        - name: contact_in
          direction: power_in
          signal_kind: power
          voltage_rating: contact_voltage
          current_rating: contact_current
        - name: contact_out
          direction: power_out
          signal_kind: power
          voltage_rating: contact_voltage
          current_rating: contact_current
        - name: tripped
          direction: output
          signal_kind: digital
        - name: gnd
          direction: ground
          signal_kind: ground
    ratings:
      absolute_maximums:
        - name: input_voltage
          parameter: input_voltage
        - name: contact_voltage
          parameter: contact_voltage
        - name: contact_current
          parameter: contact_current
    thermal:
      held_constant: true
      temperature: "298.15 K"
    plugin:
      cpp: watchdog
parts:
  - name: watchdog_24v_generic
    type: watchdog
    tier: behavioral
    source: placeholder values, no datasheet assigned
    values:
      mass: "0.1 kg"
      timeout: "50 ms"
      cutoff_delay: "10 ms"
      input_voltage: "3.3 V"
      contact_voltage: "30 V"
      contact_current: "10 A"
      manual_reset: false
    placeholders: [mass, timeout, cutoff_delay, input_voltage, contact_voltage, contact_current]
