# Behavioral stepper motor type and a NEMA 17 class part. Every numeric part value is a placeholder: the requirements
# doc gives no datasheet values, and the datasheet curve source is owed by the owner (docs/spec/lib.md).
# viscous_damping 2e-3 N m s/rad is a coordinator placeholder for a damping ratio near 0.1 on the gantry lift
# (D = 2 zeta sqrt(K J), K about 20 N m/rad, J about 7.5e-6 kg m^2; sig.md open parameters, SIG-033).
types:
  - name: stepper_behavioral
    version: 1.0.0
    category: actuator
    description: Hybrid stepper, behavioral model; torque limited by a torque-speed table.
    parameters:
      - name: mass
        dimension: "[mass]"
        minimum: "0 kg"
      - name: step_angle
        dimension: dimensionless
        minimum: "0.1 deg"
        maximum: "15 deg"
      - name: holding_torque
        dimension: "[mass] * [length] ** 2 / [time] ** 2"
        minimum: "0 N*m"
      - name: rotor_inertia
        dimension: "[mass] * [length] ** 2"
        minimum: "0 kg*m**2"
      - name: viscous_damping
        dimension: "[mass] * [length] ** 2 / [time]"
        minimum: "0 N*m*s"
      - name: rated_current
        dimension: "[current]"
        minimum: "0 A"
      - name: max_voltage
        dimension: "[mass] * [length] ** 2 / [time] ** 3 / [current]"
        minimum: "0 V"
      - name: phase_resistance
        dimension: "[mass] * [length] ** 2 / [time] ** 3 / [current] ** 2"
        minimum: "0 ohm"
      - name: phase_inductance
        dimension: "[mass] * [length] ** 2 / [time] ** 2 / [current] ** 2"
        minimum: "0 H"
      - name: detent_torque
        dimension: "[mass] * [length] ** 2 / [time] ** 2"
        default: "0 N*m"
        minimum: "0 N*m"
    tiers:
      - name: behavioral
        parameters: [mass, step_angle, holding_torque, rotor_inertia, viscous_damping, rated_current, max_voltage]
      - name: electrical
        parameters: [phase_resistance, phase_inductance, detent_torque]
    mechanical:
      mass:
        source: parameter
        parameter: mass
      mounts:
        - name: face
          kind: face
          offset: ["0 mm", "0 mm", "0 mm"]
        - name: shaft
          kind: shaft
          offset: ["0 mm", "0 mm", "24 mm"]
      shaft_axis: [0.0, 0.0, 1.0]
    electrical:
      pins:
        - name: coil_a
          direction: input
          signal_kind: coil
          voltage_rating: max_voltage
          current_rating: rated_current
        - name: coil_b
          direction: input
          signal_kind: coil
          voltage_rating: max_voltage
          current_rating: rated_current
    ratings:
      absolute_maximums:
        - name: phase_current
          parameter: rated_current
        - name: supply_voltage
          parameter: max_voltage
      holding_torque: holding_torque
      torque_speed_curve: required
    thermal:
      held_constant: true
      temperature: "298.15 K"
    plugin:
      cpp: stepper_behavioral
parts:
  - name: nema17_class_generic
    type: stepper_behavioral
    tier: behavioral
    description: NEMA 17 frame class stepper, 1.8 degree.
    source: placeholder values and placeholder torque-speed curve, no datasheet assigned
    values:
      mass: "0.28 kg"
      step_angle: "1.8 deg"
      holding_torque: "0.40 N*m"
      rotor_inertia: "54 g*cm**2"
      viscous_damping: "2e-3 N*m*s"
      rated_current: "1.5 A"
      max_voltage: "24 V"
      phase_resistance: "1.5 ohm"
      phase_inductance: "2.8 mH"
    placeholders: [mass, holding_torque, rotor_inertia, viscous_damping, rated_current, max_voltage, phase_resistance, 
          phase_inductance]
    torque_speed_curve:
      - {speed: "0 rpm", torque: "0.40 N*m"}
      - {speed: "300 rpm", torque: "0.36 N*m"}
      - {speed: "600 rpm", torque: "0.30 N*m"}
      - {speed: "1200 rpm", torque: "0.18 N*m"}
      - {speed: "1800 rpm", torque: "0.10 N*m"}
  - name: nema23_class_generic
    type: stepper_behavioral
    tier: behavioral
    description: NEMA 23 frame class stepper, 1.8 degree, 56 mm body.
    source: >-
      PLACEHOLDER datasheet values and placeholder torque-speed curve until the gantry team's datasheet (round 4 ruling
      31). Sizing on the gantry lift belt (40 mm/turn, c = 0.04 m / 2 pi = 6.366 mm): design load (5.216 kg overload
      limit x 1.15 + 0.44 kg carriage, hook and cell) = 6.438 kg at (9.81 + 0.05) m/s^2 through the 0.95 belt
      efficiency is 0.425 N m, plus the viscous damping at the 0.1 m/s lift cruise (150 rpm, 15.71 rad/s) 0.126 N m,
      0.551 N m; with a pull-out margin of 2 the curve must give 1.10 N m at 150 rpm, and gives 1.205 N m (holding
      1.26 N m). Viscous damping 8e-3 N m s/rad is a damping ratio near 0.1 on the rotor alone (D = 2 zeta sqrt(K J),
      K = 1.26 N m x pi / (2 x 1.8 deg) = 63 N m/rad, J = 2.8e-5 kg m^2).
    values:
      mass: "1.0 kg"
      step_angle: "1.8 deg"
      holding_torque: "1.26 N*m"
      rotor_inertia: "280 g*cm**2"
      viscous_damping: "8e-3 N*m*s"
      rated_current: "2.8 A"
      max_voltage: "24 V"
      phase_resistance: "0.9 ohm"
      phase_inductance: "2.5 mH"
    placeholders: [mass, holding_torque, rotor_inertia, viscous_damping, rated_current, max_voltage, phase_resistance, 
          phase_inductance]
    torque_speed_curve:
      - {speed: "0 rpm", torque: "1.26 N*m"}
      - {speed: "300 rpm", torque: "1.15 N*m"}
      - {speed: "600 rpm", torque: "0.95 N*m"}
      - {speed: "1200 rpm", torque: "0.60 N*m"}
      - {speed: "1800 rpm", torque: "0.35 N*m"}
  - name: stepperonline_17hs19_2004s1
    type: stepper_behavioral
    tier: behavioral
    description: StepperOnline 17HS19-2004S1, NEMA 17, 1.8 degree, 48 mm body, 2.0 A bipolar.
    source: >-
      REPLACEABLE sourced part (brief M3-GV; URLs in docs/gantry-team-inputs.md). StepperOnline drawing rev 8.1.2025:
      2.00 A/phase, 1.60 ohm, 3.00 mH, holding torque 0.59 N m, 1.8 deg, rotor inertia 82 g cm^2 (the distributor page
      gives 1.4 ohm: the drawing is used); mass 390 g from the distributor page (the drawing leaves it blank). Curve:
      the published pull-out graph "17HS19-2004S pull out torque (2A, 24V half step)", read by eye at its plotted
      points (about 1 N cm); it has no 0 rpm point and ends at 750 rpm, so LIB-034's 0 rpm point is the holding torque
      (the graph's low-speed plateau is 0.42 to 0.43 N m) and no torque is available above 750 rpm. max_voltage is the
      graph's 24 V drive supply, not a rated maximum; viscous_damping is not published and stays the generic NEMA 17
      placeholder.
    values:
      mass: "0.39 kg"
      step_angle: "1.8 deg"
      holding_torque: "0.59 N*m"
      rotor_inertia: "82 g*cm**2"
      viscous_damping: "2e-3 N*m*s"
      rated_current: "2.0 A"
      max_voltage: "24 V"
      phase_resistance: "1.6 ohm"
      phase_inductance: "3.0 mH"
    placeholders: [viscous_damping, max_voltage]
    torque_speed_curve:
      - {speed: "0 rpm", torque: "0.59 N*m"}
      - {speed: "60 rpm", torque: "0.30 N*m"}
      - {speed: "90 rpm", torque: "0.42 N*m"}
      - {speed: "180 rpm", torque: "0.43 N*m"}
      - {speed: "300 rpm", torque: "0.42 N*m"}
      - {speed: "450 rpm", torque: "0.39 N*m"}
      - {speed: "600 rpm", torque: "0.33 N*m"}
      - {speed: "750 rpm", torque: "0.23 N*m"}
  - name: stepperonline_23hs22_2804s
    type: stepper_behavioral
    tier: behavioral
    description: StepperOnline 23HS22-2804S, NEMA 23, 1.8 degree, 56 mm body, 2.8 A bipolar.
    source: >-
      REPLACEABLE sourced part (brief M3-GV; URLs in docs/gantry-team-inputs.md). StepperOnline drawing: 2.80 A/phase,
      0.90 ohm, 2.50 mH, holding torque 1.26 N m, 1.8 deg, rotor inertia 300 g cm^2, 0.70 kg, rated voltage 2.5 V.
      Curve: the published pull-out graph "(2.5A/P 24V half step)", taken below the 2.8 A rating, read by eye at its
      plotted points (about 1 N cm); it has no 0 rpm point and ends at 900 rpm, so LIB-034's 0 rpm point is the
      holding torque (the graph's lowest point is 0.81 N m at 75 rpm) and no torque is available above 900 rpm.
      max_voltage is the graph's 24 V drive supply, not a rated maximum; viscous_damping is not published and stays the
      generic NEMA 23 placeholder.
    values:
      mass: "0.70 kg"
      step_angle: "1.8 deg"
      holding_torque: "1.26 N*m"
      rotor_inertia: "300 g*cm**2"
      viscous_damping: "8e-3 N*m*s"
      rated_current: "2.8 A"
      max_voltage: "24 V"
      phase_resistance: "0.9 ohm"
      phase_inductance: "2.5 mH"
    placeholders: [viscous_damping, max_voltage]
    torque_speed_curve:
      - {speed: "0 rpm", torque: "1.26 N*m"}
      - {speed: "75 rpm", torque: "0.81 N*m"}
      - {speed: "150 rpm", torque: "0.76 N*m"}
      - {speed: "300 rpm", torque: "0.70 N*m"}
      - {speed: "600 rpm", torque: "0.43 N*m"}
      - {speed: "900 rpm", torque: "0.215 N*m"}
