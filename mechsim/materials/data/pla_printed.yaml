  typ: "1500 J/(kg*K)"
  max: "1800 J/(kg*K)"
thermal_expansion:
  min: "6e-05 1/K"
  typ: "7e-05 1/K"
  max: "9e-05 1/K"
max_service_temperature:
  min: "313 K"
  typ: "323 K"
  max: "328 K"
process:
