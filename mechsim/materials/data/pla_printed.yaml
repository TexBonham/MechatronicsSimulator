name: pla_printed
family: polymer
grade: PLA, FDM printed
description: Printed PLA; strengths are for the stated process and scale with the direction factors.
source: placeholder, wide conservative spread, no coupon tests yet
placeholder: true
wide_spread_default: true
density:
  min: "1150 kg/m**3"
  typ: "1240 kg/m**3"
  max: "1260 kg/m**3"
youngs_modulus:
  min: "1.5 GPa"
  typ: "2.8 GPa"
  max: "3.6 GPa"
poissons_ratio:
  min: "0.3"
  typ: "0.33"
  max: "0.36"
yield_strength:
  min: "20 MPa"
  typ: "40 MPa"
  max: "60 MPa"
  temperature_dependence:
    - {temperature: "253 K", factor: 1.1}
    - {temperature: "296 K", factor: 1.0}
    - {temperature: "323 K", factor: 0.6}
ultimate_strength:
  min: "25 MPa"
  typ: "45 MPa"
  max: "65 MPa"
  temperature_dependence:
    - {temperature: "253 K", factor: 1.1}
    - {temperature: "296 K", factor: 1.0}
    - {temperature: "323 K", factor: 0.6}
shear_strength:
  min: "10 MPa"
  typ: "25 MPa"
  max: "40 MPa"
