[project]
name = "mechsim"
version = "0.0.0"
description = "Mechatronic simulator: runs a design's real firmware against a physics model and scores it against test cases."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
    "ruamel.yaml",
    "pint",
    "h5py",
    "jsonschema",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mechsim"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["build"]
src = [".", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "PT", "N"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mechsim"]
modules = ["check_imports", "traceability"]
mypy_path = "tools"
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
xfail_strict = true
addopts = ["--strict-markers"]
markers = [
    "req(id): cites the spec requirement this test verifies, e.g. ENG-001",
]
