[project]
name = "mechsim"
version = "0.0.0"
description = "Mechatronic simulator: runs a design's real firmware against a physics model and scores it against test cases."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pydantic>=2",
    "ruamel.yaml",
    "pint",
    "h5py",
    "jsonschema",
    "websockets>=13",
]

[project.scripts]
mechsim = "mechsim.cli:main_exit"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

# The compiled core runtime, mechsim._core_ext, is built by CMake from the root CMakeLists.txt with the release
# preset's build type; pybind11 and Eigen are fetched by CMake at pinned tags (core/bindings/, core/cmake/).
[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.28"
cmake.source-dir = "."
cmake.build-type = "Release"
build-dir = "build/python/{wheel_tag}"
build.targets = ["_core_ext"]
install.components = ["python"]
wheel.packages = ["mechsim"]

# uv rebuilds the extension when any of these change (C++ sources are not Python sources it would watch otherwise).
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "core/**/*.cpp" },
    { file = "core/**/*.hpp" },
    { file = "**/CMakeLists.txt" },
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["build"]
src = [".", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "PT", "N"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mechsim"]
modules = ["check_imports", "traceability"]
mypy_path = "tools"
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
xfail_strict = true
addopts = ["--strict-markers"]
markers = [
    "req(id): cites the spec requirement this test verifies, e.g. ENG-001",
]
