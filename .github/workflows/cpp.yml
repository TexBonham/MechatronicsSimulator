name: cpp

on:
  push:
  pull_request:

jobs:
  cpp:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - cxx: g++
            packages: g++
          - cxx: clang++
            packages: clang libclang-rt-18-dev
    env:
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: MuJoCo include boundary (PHY-011, ADR 0014)
        run: |
          if grep -rnE '^\s*#\s*include\s*[<"]mujoco/' core | grep -v '^core/physics/mujoco/'; then
            echo "MuJoCo headers are allowed only under core/physics/mujoco/"
            exit 1
          fi
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy ${{ matrix.compiler.packages }}
      # Configure fetches the pinned MuJoCo release archive (core/cmake/MuJoCo.cmake) with its SHA-256.
      - name: Configure debug-sanitize
        run: cmake --preset debug-sanitize
      - name: Build debug-sanitize
        run: cmake --build --preset debug-sanitize
      - name: Test debug-sanitize
        run: ctest --preset debug-sanitize
      - name: Configure release
        run: cmake --preset release
      - name: Build release
        run: cmake --build --preset release
      - name: Test release
        run: ctest --preset release

  cpp-windows:
    # MSVC through the VS developer environment (cl, Ninja and CMake on PATH); clang-tidy and the include-boundary
    # grep stay on the Linux job, which already covers every source file.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Toolchain versions
        run: |
          cmake --version
          ninja --version
      - name: Configure windows-debug
        run: cmake --preset windows-debug
      - name: Build windows-debug
        run: cmake --build --preset windows-debug -- -k 0
      - name: Test windows-debug (reference tier runs on windows-release; unoptimised MSVC took 57 min on it)
        run: ctest --preset windows-debug -LE reference
      - name: Configure windows-release
        run: cmake --preset windows-release
      - name: Build windows-release
        run: cmake --build --preset windows-release -- -k 0
      - name: Test windows-release
        run: ctest --preset windows-release
