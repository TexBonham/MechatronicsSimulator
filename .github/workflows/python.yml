name: python

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install C++ toolchain
        # uv sync builds the core runtime's binding (mechsim._core_ext) through scikit-build-core and CMake.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      - name: Sync environment
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        # The long-run tests (the acceptance checks of G2 to G16, the G16 sweep, PHY-016 on the bridge, ACC-037, the
        # G1 to G16 batch) run in python-long only. Measured on the WSL runner 2026-11-14 (brief M3-X2d): 1299 s for
        # this set (2259 s before the move); it still runs G1, G3 and G8 end to end on native, G7 on the bridge and
        # the pendulum.
        run: uv run pytest -m "not long_run"

  python-long:
    # The long-run marker (pyproject.toml): measured 3705 s on the WSL runner 2026-11-14 (brief M3-X2d), the G1 to G16
    # batch (ACC-036) 1289 s of it.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      - name: Sync environment
        run: uv sync --locked
      - name: Long-run tests
        run: uv run pytest -m long_run

  python-windows:
    runs-on: windows-2022
    env:
      # scikit-build-core and the per-process firmware host build (CTL-007) both use cl and Ninja from the
      # developer environment below.
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Sync environment
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        # Long-run tests excluded (python-long runs them); the same set as the python job (1299 s measured on Linux,
        # brief M3-X2d): G1, G3 and G8 end to end on native, G7 on the bridge, the pendulum.
        run: uv run pytest -m "not long_run"
