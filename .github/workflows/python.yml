name: python

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install C++ toolchain
        # uv sync builds the core runtime's binding (mechsim._core_ext) through scikit-build-core and CMake.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      - name: Sync environment
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        # The long-run tests (whole gantry runs at 10 substeps, the G16 sweep, PHY-016 on the bridge, ACC-037, the
        # G1 to G16 batch) run in python-long only; this job is expected to take about 20 minutes.
        run: uv run pytest -m "not long_run"

  python-long:
    # The long-run marker (pyproject.toml): about 70 minutes, the G1 to G16 batch (ACC-036) about 35 of them.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      - name: Sync environment
        run: uv sync --locked
      - name: Long-run tests
        run: uv run pytest -m long_run

  python-windows:
    runs-on: windows-2022
    env:
      # scikit-build-core and the per-process firmware host build (CTL-007) both use cl and Ninja from the
      # developer environment below.
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Sync environment
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        # Long-run tests excluded (python-long runs them); keeps this job under 30 minutes.
        run: uv run pytest -m "not long_run"
