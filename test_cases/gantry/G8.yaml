# G8 (Requirements doc, Test cases, gantry suite): the controller freezes mid-move for longer than the watchdog
# timeout; the motors stop within the heartbeat timeout plus the cutoff delay (ACC-016, FW-025). The freeze starts at
# 9 s, 1 s into the move to (40, 25), and lasts 1 s, longer than the 50 ms timeout of watchdog_24v_generic (round 4
# ruling 6). From 9 s + 50 ms timeout + 10 ms cutoff + one 10 ms heartbeat period (the last edge may precede the freeze
# by up to one period) = 9.07 s the motor rail is off, the steppers get no supply and no axis moves (no_motion on the
# three motors, threshold one microstep angle, 2 pi / 3200 rad, under 2 mm of belt travel).
id: G8
title: Controller freeze mid-move
design:
  name: gantry
  version: 0.1.0
controller_mode: native
seed: 8
open_parameters:
  - name: homing_time
    dimension: "[time]"
    owed_by: gantry team
    note: Time allowed for homing before the target; 0.1 m at the 0.02 m/s homing speed is 5 s.
    default: "8 s"
initial_state:
  joints:
    - joint: x_axis
      position: 0.1 m
      velocity: 0 m/s
    - joint: y_axis
      position: 0.1 m
      velocity: 0 m/s
    - joint: lift_axis
      position: 0.1 m
      velocity: 0 m/s
  controller:
    state: not_homed
  payload:
    attached: false
commands:
  - at: 0 s
    message: home
  - at: ${homing_time}
    message: target
    payload:
      x: 40 cm
      y: 25 cm
faults:
  - kind: controller_freeze
    start: 9 s
    duration: 1 s
end:
  at: 12 s
  max_duration: 12 s
criteria:
  - name: motors_stopped
    check: no_motion
    actuators: [x_motor, y_motor, lift_motor]
    threshold: 0.00196 rad
    window:
      start: 9.07 s
      end: 10 s
baseline: baseline.yaml
