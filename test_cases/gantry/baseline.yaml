design:
  name: gantry
  version: 0.1.0
suite: gantry
note: "placeholder-geometry: G1 to G15 on the native adapter, the default since M3-X2 (bridge values of record in bridge_baselines/,
  PHY-025); integrity counts from the suite's one evaluation start, 9 s (README.md); G5 and G6 error on native (the adapter
  refuses a mass change on the rope-hung payload, a core finding); rails and belts damped 0.01 (ruling 78), the gantry team
  values of 2026-11-11, the NEMA 23 motor placeholder (M2-X7) and the 2 Hz amplifier placeholder (ruling 35, M2-X8)"
