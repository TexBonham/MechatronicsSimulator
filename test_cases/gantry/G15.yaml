# G15 (Requirements doc, Test cases, gantry suite): structural worst cases with the design load. Pass: every member's
# minimum safety factor at or above the design's minimum (ACC-029; 1.5, gantry team 2026-11-11), every member's
# node-pose deflection under the 1 cm target from 8 s (ACC-030; the dynamic peak, the conservative reading while the
# target's static or dynamic sense is owed: deflection_target_mode) and its settled value within 2 percent of the
# closed form, and no tier 1 crossing (a crossing fails a passing case, SCO-015). Tier 1 runs
# (designs/gantry/integrity.yaml) without halting, so the whole run is scored; the peak member end loads are exported
# beside the archive as the load case (INT-022). Native adapter only: the bridge builds the rails rigid and evaluates
# no tier 1 (rulings 29, 34).
#
# Design load (ruling 52: the case carries it, tier 1 applies no factor): rated load + 15 percent = 4.536 kg x 1.15 =
# 5.2164 kg on payload_rope (the rated load is the gantry team's 10 lb; the rule is the design's structural section).
# The post-run table multiplies every recorded load and deflection by the design's 1.15 again (INT-019): the table
# values below are at 1.3225 times the rated load (finding, reported to the integrity owner).
# Part (a), maximum acceleration: target (25, 25) at 8 s, both axes at the 0.05 m/s^2 limit to mid-travel of both
# rails (rail_y at x 0.25 m, the middle of rail_x; the trolley at y 0.25 m, the middle of rail_y), arrived by about
# 12.75 s, held to 15 s. Part (b), E-stop with a swinging load: target (5, 25) at 15 s, the E-stop at 16.5 s, 1.5 s
# into the ramp (0.075 m/s) with the payload still swinging from part (a), released 1 s later; observed to 22 s.
# Step: 100 microseconds (substeps 10), as G12 (ruling 21).
#
# Settle window. The run starts with the rails straight (no static start), so their loads arrive as a suddenly applied
# load. The rails have no node damping (the design has no such field; node_damping 0): the only loss is backward
# Euler's, x = omega h = 0.0312 (rail_x, 49.70 Hz) and 0.0314 (rail_y, 50.00 Hz), amplitude kept 0.907 per period, an
# e-fold time 2 / (omega^2 h) = 0.205 s. rail_y's start transient drives rail_x at its own frequency through the
# carried joint (one-way, feed-forward: rail_y does not ride rail_x), so rail_x's transient grows as t exp(-t / tau),
# peaks at tau and is below 1 percent of the static deflection by about 11 tau = 2.3 s; homing runs to 5.25 s and the
# deflection criteria start at 8 s. The safety factor (one table sample, the run's minimum) and the tier 1 crossings
# have no window: the start transient counts in both (finding, reported).
#
# Oracles (item 1 of brief M3-X1d; E I and w of the calibrated chains: rail_x 64.087 N m^2, 51.641 N/m, 16 segments
# clamped-clamped; rail_y 256.35 N m^2, 39.710 N/m, 8 segments pinned-roller, rail_calibration 100 N for 1 mm at
# mid-span, 50 Hz). Static deflection at mid-travel: rail_x w L^4 / (384 E I) + (P_c + P) L^3 / (192 E I), rail_y
# 5 w L^4 / (384 E I) + (P_t + P) L^3 / (48 E I), with P = 51.286 N (design load, rope and shackle), P_c = 43.856 N
# (rail_y and everything on it), P_t = 9.000 N (trolley, lift, hook): 1.09767 mm and 0.73848 mm, times 1.15 in the
# table: 1.26232 mm and 0.84925 mm, the settled criteria's targets (measured on a static run: -1.56 and -1.41 percent,
# the chain's -1 / N^2 at mid-span; at sixteen segments clamped and eight pinned-roller, ruling 67's L^2 / (4 N^2 a b)
# is 1.6 percent at mid-span, 2.4 percent at the 0.1 m end of rail_y's travel: eight segments kept). Static bending
# stress M c / I, c = 0.02 m, I = 2e-8 m^4: rail_x (P_c + P) L / 8 + w L^2 / 12 = 7.02 N m, 7.02 MPa; rail_y
# (P_t + P) L / 4 + w L^2 / 8 = 8.78 N m, 8.78 MPa: a static safety factor of 13.71 / 8.78 = 1.56 against the
# placeholder PETG strength (tier 1 limit 9.14 MPa = 13.71 MPa / 1.5), 1.36 with the table's second 1.15, under the
# 1.5 minimum (finding against the placeholder rail section and material; the post-run table reads rail_y from its
# end loads only, zero moment at pinned ends, and shows 9.4: finding against the strength check). Dynamic factor of the rigid-body loads: the drive force at d =
# 0.04 m above rail_x's axis adds d m a = 0.02 N m at 0.05 m/s^2 (0.3 percent), the swing adds m g theta^2 (under 0.5
# percent at 0.07 rad), the carriage crosses the rail slowly against its 50 Hz mode: 1.01 at most.
# Measured (M3-X1d, native): settled rail_x 1.2427 mm, rail_y 0.8373 mm (table); part (a) peak rail_x 4.20 mm, rail_y
# 0.94 mm; the E-stop sends rail_y's vertical load from 80 N to 243 N (the lift's hold released onto its limit) and
# rail_y, at 50 Hz, drives rail_x at 49.7 Hz through the feed-forward coupling: rail_x's end loads reach +-1.9 kN and
# its deflection 16.8 mm (14.6 mm unfactored, 10.7 J of elastic energy against about 0.03 J in rail_y's oscillation
# and 0.03 J of carriage kinetic energy): safety factor 0.11 at 16.74 s, deflection over 1 cm, tier 1 crossings of
# rail_x's deflection and the fastenings (frame_mount 1.387 kN at 16.58 s, rail_x_mount 1.337 kN at 16.6 s against
# 1.333 kN = 2 kN / 1.5). Finding: an energy defect of the one-way coupling at matched frequencies (engine, ruling 67),
# made acute by both rails sharing the placeholder 50 Hz calibration (gantry team: each rail's own frequency).
id: G15
title: Structural worst cases with the design load
design:
  name: gantry
  version: 0.1.0
controller_mode: native
seed: 15
physics:
  adapter: native
  substeps: 10
integrity:
  halt_on_crossing: false
open_parameters:
  - name: design_load_mass
    dimension: "[mass]"
    owed_by: gantry team
    note: Design load on the rope, rated load + 15 percent (4.536 kg x 1.15); PLACEHOLDER with the rated load.
    default: "5.2164 kg"
initial_state:
  joints:
    - joint: x_axis
      position: 0.1 m
      velocity: 0 m/s
    - joint: y_axis
      position: 0.1 m
      velocity: 0 m/s
    - joint: lift_axis
      position: 0.1 m
      velocity: 0 m/s
  controller:
    state: not_homed
  payload:
    attached: true
    body: hook
    mass: ${design_load_mass}
commands:
  - at: 0 s
    message: home
  - at: 8 s
    message: target
    payload:
      x: 25 cm
      y: 25 cm
  - at: 15 s
    message: target
    payload:
      x: 5 cm
      y: 25 cm
faults:
  - kind: estop_press
    target: estop
    start: 16.5 s
    duration: 1 s
end:
  at: 22 s
  max_duration: 22 s
criteria:
  - name: ready_after_homing
    check: event
    event: state:ready
    expect: present
  - name: safety_factor_rail_x
    check: value
    quantity: safety_factor:rail_x
    statistic: minimum
    comparison: at_least
    limit: ${minimum_safety_factor}
  - name: safety_factor_rail_y
    check: value
    quantity: safety_factor:rail_y
    statistic: minimum
    comparison: at_least
    limit: ${minimum_safety_factor}
  - name: deflection_rail_x
    check: value
    quantity: deflection:rail_x
    statistic: maximum
    window:
      start: 8 s
    comparison: below
    limit: 1 cm
  - name: settled_deflection_rail_x
    check: value
    quantity: deflection:rail_x
    statistic: mean
    window:
      start: 14 s
      end: 15 s
    comparison: within
    target: 1.2623195e-3 m
    relative_limit: "0.02"
  - name: deflection_rail_y
    check: value
    quantity: deflection:rail_y
    statistic: maximum
    window:
      start: 8 s
    comparison: below
    limit: 1 cm
  - name: settled_deflection_rail_y
    check: value
    quantity: deflection:rail_y
    statistic: mean
    window:
      start: 14 s
      end: 15 s
    comparison: within
    target: 8.492532e-4 m
    relative_limit: "0.02"
