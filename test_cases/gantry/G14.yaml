  at: 20 s
  max_duration: 20 s
criteria:
  - name: no_overlap_x
    check: no_overlap
    actuator: x_driver
    start_event: event:motion_start
    end_event: event:motion_end
  - name: no_overlap_y
    check: no_overlap
    actuator: y_driver
    start_event: event:motion_start
    end_event: event:motion_end
  - name: no_overlap_lift
    check: no_overlap
    actuator: lift_driver
    start_event: event:motion_start
    end_event: event:motion_end
  - name: first_move_not_too_fast
    check: interval
    start_event: message:target
    end_event: event:motion_end
    comparison: at_least
    limit: 0.5 s
  - name: first_move_not_too_slow
    check: interval
    start_event: message:target
    end_event: event:motion_end
    comparison: below
    limit: 2.3 s
  - name: malformed_refused
    check: event
    event: fault:malformed
    expect: present
    window:
      start: 8.5 s
      end: 8.6 s
baseline: baseline.yaml
