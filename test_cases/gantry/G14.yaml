# G14 (Requirements doc, Test cases, gantry suite): fifty rapid-fire and conflicting commands, one every 0.1 s from
# 8 s to 12.9 s after homing (targets inside and outside the workspace, lifts inside and outside the 0.5 m lift travel,
# home, reset, and a malformed target whose x has seven decimals, refused with fault malformed by the line parser,
# FW-029): no two actuator commands overlap (ACC-028, FW-028). Each axis's profile is logged as `motion_start` and
# `motion_end` events naming its driver (FW-028, DES-045 axis arguments); `no_overlap` on each driver finds no start
# while one is open (SCO-025 on real events). Interval (SCO-021 on real events): the first command, `target (20, 10)`
# at 8 s, starts from the homed origin; the first `motion_end` after it is the Y axis's (0.1 m, the shorter travel;
# an axis with no travel logs no profile). Every other command in the move is refused (busy while moving, workspace,
# malformed, nothing to reset), so nothing interrupts it. Bounds: at most the 0.2 m/s cruise speed, so 0.1 m takes at
# least 0.5 s; at or above the 0.05 m/s slow-zone speed except for the 0.1 s ramps at each end (0.05 m/s / 0.5 m/s^2),
# so at most 0.1 / 0.05 + 0.2 = 2.2 s, plus the 15-byte line at 115200 baud (1.3 ms) and one control tick, under
# 2.3 s. Policies are the firmware placeholders (reject; FW-026, FW-027).
id: G14
title: Rapid-fire and conflicting commands
design:
  name: gantry
  version: 0.1.0
controller_mode: native
seed: 14
open_parameters:
  - name: homing_time
    dimension: "[time]"
    owed_by: gantry team
    note: Time allowed for homing before the first command; 0.1 m at the 0.02 m/s homing speed is 5 s.
    default: "8 s"
initial_state:
  joints:
    - joint: x_axis
      position: 0.1 m
      velocity: 0 m/s
    - joint: y_axis
      position: 0.1 m
      velocity: 0 m/s
    - joint: lift_axis
      position: 0.1 m
      velocity: 0 m/s
  controller:
    state: not_homed
  payload:
    attached: false
commands:
  - at: 0 s
    message: home
  - at: ${homing_time}
    message: target
    payload:
      x: 20 cm
      y: 10 cm
  - at: 8.1 s
    message: target
    payload:
      x: 150 cm
      y: 10 cm
  - at: 8.2 s
    message: lift
    payload:
      z: 30 cm
  - at: 8.3 s
    message: home
  - at: 8.4 s
    message: reset
  - at: 8.5 s
    message: target
    payload:
      x: 0.1234567 m
      y: 10 cm
  - at: 8.6 s
    message: target
    payload:
      x: 30 cm
      y: 20 cm
