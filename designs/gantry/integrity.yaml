# Integrity table of the gantry (ruling 27, brief M3-X1a item 2). Limits from the design's structural section: minimum
# safety factor 1.5 and the 1 cm accuracy target as the deflection limit (plan assumption 6; gantry team 2026-11-11
# for the 1.5). Tier 1 (strength, deflection, buckling, fastener) runs on the native adapter (the bridge, which
# evaluated no tier 1, was retired, ADR 0004). Tier 2: impact, and
# rope_snap for payload_rope. Strength stays at tier 1: at tier 2 its yield offset sends model change requests
# through the physics party, and a native run then fails in the core binding ("coupling payload
# 'ModelChangeRequests' has no Python form"; reported by M3-X1a, owner core/bindings). Fatigue and resonance are left
# out: the printed PETG record holds no S-N data and the drive excitation table is not set (both owed by the gantry
# team).
schema_version: 1
checks:
  - check: strength
  - check: deflection
  - check: buckling
  - check: fastener
    parameters:
      # REPLACEABLE sourced ratings (brief M3-GV) until the gantry team gives fastener grades and counts (ruling 27):
      # one load rating per mount, the fixed joints holding the frame on the world and rail_x on the frame, each the
      # proof load of ONE M5 x 0.8 ISO 898-1 class 8.8 bolt (steel_8_8 in the library): 8230 N on the 14.2 mm^2 stress
      # area (580 MPa; minimum ultimate 11350 N), Engineering ToolBox's ISO 898-1 table (docs/gantry-team-inputs.md).
      # One bolt per mount is the least a mount can have: the bolt count stays owed, so the rating is the lower bound.
      ratings:
        frame_mount: 8.23 kN
        rail_x_mount: 8.23 kN
  - check: impact
    parameters:
      # PLACEHOLDER (brief M3-GV: no published source for the gantry's impact factor, step threshold or window).
      impact_factor: 2.0
      step_threshold: 50 N
      window: 20 ms
  - check: rope_snap
    tier: 2
