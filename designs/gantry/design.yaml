# Gantry reference design (DES-025), draft. Values the requirements doc gives are set: 1 cm position accuracy, 1 kHz
# control tick (C4), rated load plus 15 percent design-load rule. Physics stand-ins are marked PLACEHOLDER; everything
# else is a ${name} open parameter owed by the gantry team. Every open parameter carries a default (DES-044), a
# PLACEHOLDER UNTIL THE GANTRY TEAM RULES: the run uses it when neither the case nor --set gives a value. Kinematic
# chain: frame on the world; rail_x fixed on the frame; rail_y travels along x on rail_x; the trolley travels along y
# on rail_y; the lift carriage travels along z on the trolley (belt, every axis belt-driven: gantry team 2026-11-11);
# the hook hangs from the lift carriage. Each axis motor drives a shaft body on a revolute joint. MCU pin names come from the
# placeholder chip chips/stm32_placeholder until the STM32 part is selected. The controller heartbeat is a digital
# output pin bound to the watchdog's heartbeat port; the watchdog and the E-stop relay both gate motor power.
name: gantry
version: 0.1.0
source_hash: unset
status: draft
description: Overhead X-Y gantry with a belt-driven hook lift; the first reference design.
open_parameters:
  - name: workspace_x
    dimension: "[length]"
    owed_by: gantry team
    note: X travel of the rectangular workspace; gantry team 2026-11-11.
    default: "0.5 m"
  - name: workspace_y
    dimension: "[length]"
    owed_by: gantry team
    note: Y travel of the rectangular workspace; gantry team 2026-11-11.
    default: "0.5 m"
  - name: lift_travel
    dimension: "[length]"
    owed_by: gantry team
    note: Vertical travel of the hook lift; gantry team 2026-11-11.
    default: "0.5 m"
  - name: rated_load
    dimension: "[mass]"
    owed_by: gantry team
    note: >-
      Rated load 10 lb, gantry team 2026-11-11; the overload limit is rated + 15 percent = 5.216 kg
      (GANTRY_OVERLOAD_LIMIT_MILLIKG).
    default: "4.536 kg"
  - name: cad_model
    dimension: choice
    owed_by: gantry team
    note: Body geometry, mass properties, joint placements and motor shaft axes come from the Fusion 360 model (row 23).
    default: "placeholder_primitives"
  - name: body_materials
    dimension: choice
    owed_by: gantry team
    note: >-
      Material and process of the printed bodies (frame, rails, trolley, lift carriage, hook): PETG, 3D printed
      lengthwise (print direction along the rail), gantry team 2026-11-11. The petg_printed record's mechanical
      properties stay PLACEHOLDER datasheet values (wide spread) until the team gives them. Scope: printed bodies only;
      the motor shafts (x_motor_shaft, y_motor_shaft, lift_motor_shaft) are bought steel parts, PLACEHOLDER
      bearing_steel_52100 machined, and the belt pulleys are catalog parts (belt_pulley.yaml), until the CAD.
    default: "petg_printed"
  - name: rail_section_area
    dimension: "[length] ** 2"
    owed_by: gantry team
    note: Rail extrusion section area (row 17 planning default, rails flexible with extrusion sections).
    default: "1.5e-4 m**2"
  - name: rail_section_second_moment
    dimension: "[length] ** 4"
    owed_by: gantry team
    note: Rail extrusion section second moment of area.
    default: "2e-8 m**4"
  - name: rail_calibration
    dimension: choice
    owed_by: gantry team
    note: Known deflection and first natural frequency each rail is calibrated to, from hand calculation or FEA.
    default:
      source: hand
      load: 100 N
      deflection: 1 mm
      first_natural_frequency: 50 Hz
  - name: encoder_placement
    dimension: choice
    owed_by: gantry team
    note: >-
      Motor shaft or axis side (row 14): axis side, frame, gantry team 2026-11-11 (ruling 32 confirmed): each axis
      carries a linear_encoder_generic sensing its axis joint, so belt slip and stall both show as a step-count versus
      encoder mismatch. Counts per metre (60 000) stay PLACEHOLDER.
    default: "frame"
  - name: load_cell_type
    dimension: choice
    owed_by: gantry team
    note: >-
      Weight sensor part; PLACEHOLDER load_cell_5kg_generic on the hook reading the case payload, through load_amp
      (gain 241.8 so the firmware's 600 counts per kg holds with the 12-bit 3.3 V placeholder ADC). No weight sensor
      declared by the gantry team (2026-11-11); G5 and G6 need one or another overload detection.

    default: "load_cell_5kg_generic"
  - name: deflection_target_mode
    dimension: choice
    owed_by: gantry team
    note: Whether the 1 cm deflection target is static or dynamic (row 17; planning default static, dynamic reported).
    default: "static"
  - name: minimum_safety_factor
    dimension: dimensionless
    owed_by: gantry team
    note: Minimum structural safety factor (ADR 0009); 1.5, living in the design, gantry team 2026-11-11.
    default: "1.5"
  - name: swing_limit_angle
    dimension: dimensionless
    owed_by: gantry team
    note: Limit for load swing angle.
    default: "0.1"
  - name: swing_settle_time
    dimension: "[time]"
    owed_by: gantry team
    note: Limit for load swing settle time.
    default: "5 s"
  - name: new_target_policy
    dimension: choice
    owed_by: gantry team
    note: >-
      New target during a move: operator choice, reject or queue (gantry team 2026-11-11); a firmware parameter
      (GANTRY_NEW_TARGET_POLICY), default reject.
    default: "reject"
  - name: lift_while_moving_policy
    dimension: choice
    owed_by: gantry team
    note: Whether lifting is allowed while moving.
    default: "reject"
  - name: power_loss_hold
    dimension: choice
    owed_by: gantry team
    note: >-
      How the gantry holds its load when power is cut: brake (gantry team 2026-11-11, round 4 ruling 1 confirmed):
      lift_brake, a spring-applied brake_24v_generic on the motor rail, holds the lift whenever the coil is
      unpowered. The brake part's ratings stay placeholders.
    default: "brake"
  - name: stm32_part
    dimension: choice
    owed_by: gantry team
    note: >-
      STM32 chip: NUCLEO-G474RE (STM32G474RE), gantry team 2026-11-11. firmware.chip still names
      chips/stm32_placeholder, which stands in for the STM32G474RE until the milestone 4 peripheral smoke test.
    default: "stm32g474re"
  - name: logic_supply
    dimension: choice
    owed_by: gantry team
    note: Supply of the controller's logic rail; placeholder accepted by the gantry team 2026-11-11.
    default: "logic_psu"
  - name: ambient_temperature
    dimension: "[temperature]"
    owed_by: gantry team
    note: Ambient temperature of the operating environment; placeholder accepted by the gantry team 2026-11-11.
    default: "298.15 K"
  - name: contact_stiffness
    dimension: "[mass] / [time] ** 2"
    owed_by: gantry team
    note: Default normal contact stiffness (DES-042, ADR 0002); placeholder accepted by the gantry team 2026-11-11.
    default: "100000 N/m"
  - name: contact_damping
    dimension: "[mass] / [time]"
    owed_by: gantry team
    note: Default normal contact damping; placeholder accepted by the gantry team 2026-11-11.
    default: "1000 N*s/m"
  - name: contact_friction
    dimension: dimensionless
    owed_by: gantry team
    note: Default Coulomb friction coefficient; placeholder accepted by the gantry team 2026-11-11.
    default: "0.5"
  - name: axis_friction
    dimension: "[mass] * [length] / [time] ** 2"
    owed_by: gantry team
    note: Friction force of each linear axis.
    default: "0 N"
  - name: axis_damping
    dimension: "[mass] / [time]"
    owed_by: gantry team
    note: Viscous damping of each linear axis.
    default: "0 N*s/m"
  - name: axis_backlash
    dimension: "[length]"
    owed_by: gantry team
    note: Backlash of each linear axis.
    default: "0 m"
  - name: shaft_friction
    dimension: "[mass] * [length] ** 2 / [time] ** 2"
    owed_by: gantry team
    note: Friction torque of each motor shaft bearing.
    default: "0 N*m"
  - name: shaft_damping
    dimension: "[mass] * [length] ** 2 / [time]"
    owed_by: gantry team
    note: Viscous damping of each motor shaft bearing.
    default: "0 N*m*s"
  - name: shaft_backlash
    dimension: dimensionless
    owed_by: gantry team
    note: Angular backlash of each motor shaft.
    default: "0"
  - name: hook_friction
    dimension: "[mass] * [length] ** 2 / [time] ** 2"
    owed_by: gantry team
    note: Friction torque of the hook suspension.
    default: "0 N*m"
  - name: hook_damping
    dimension: "[mass] * [length] ** 2 / [time]"
    owed_by: gantry team
    note: Viscous damping of the hook suspension.
    default: "0 N*m*s"
  - name: hook_backlash
    dimension: dimensionless
    owed_by: gantry team
    note: Angular backlash of the hook suspension.
    default: "0"
environment:
  gravity: [0 m/s**2, 0 m/s**2, -9.81 m/s**2]
  ambient_temperature: ${ambient_temperature}
  contact:
    # Contact parameters: placeholders accepted by the gantry team 2026-11-11 (contact_stiffness, contact_damping,
    # contact_friction).

    default:
      stiffness: 100000 N/m
      damping: 1000 N*s/m
      friction: "0.5"
    # The frame is fixed to the world at the origin, so the floor is the world x-y plane.
    floor:
      normal: [0.0, 0.0, 1.0]
      offset: 0 m
# PLACEHOLDER GEOMETRY until the gantry team's CAD arrives (DES open parameter cad_model).
# Every body below is a box or cylinder of printed PETG (body_materials, gantry team 2026-11-11; build direction along
# each rail, along z elsewhere), except the motor shafts, machined steel (placeholder; body_materials covers printed
# bodies only), with mass properties computed from it, and every joint placement, motor axis, joint friction, damping
# and backlash and rail section is a stand-in chosen only so the rigid gantry builds. Gantry team
# sizes (2026-11-11): workspace x 0.5 m, workspace y 0.5 m, lift travel 0.5 m, rails 0.5 m each, so each rail spans
# exactly its carriage's travel (rail_x from x 0.1 m to 0.6 m between the end posts, rail_y from y 0.1 m to 0.6 m).
# rail_x stands 1.2 m above the floor (placeholder; 1.0 m until M3-X1a): the case payload hangs 0.3 m below the hook
# on payload_rope on the native adapter, so at the lift's home (0 m) its 0.1 m box clears the floor by 0.12 m
# (hook 0.54 m, rope point 0.52 m, payload top 0.22 m); at 1.0 m it rested 8 cm into the floor.
# Each rail's body frame has its origin at the rail's root end and its x axis along the rail, because a lumped member
# runs along its body's x from the body origin (BLD-017): rail_x from x 0.1 m, rail_y (turned 90 degrees about z, so
# its x is world y) from y 0.1 m (M3-X1a; before, both frames sat at the rail's far side and rail_y's x crossed it).
# Reference configuration (all joint coordinates zero), world positions of the body frames: frame (0, 0, 0),
# rail_x (0.1, 0, 1.2), rail_y (0.1, 0.1, 1.24), trolley (0.1, 0.1, 1.29), lift_carriage (0.1, 0.1, 0.64), hook
# (0.1, 0.1, 0.54), x_motor_shaft (-0.05, -0.1, 1.2), y_motor_shaft (0.1, -0.05, 1.24), lift_motor_shaft
# (0.1, 0.1, 1.34); no two bodies not joined to each other overlap there (BLD-022). The lift carriage hangs 0.65 m
# below the trolley so the full 0.5 m lift travel keeps its top (1.16 m) below rail_x (1.22 m); at 0.3 m it struck
# rail_x at 0.21 m of travel (M2-X3). x_axis and y_axis carry 5 N of placeholder Coulomb friction (M2-X3): without it
# an axis cut off mid-move by the E-stop coasted at 0.2 m/s to its far limit (G7); 5 N stops it within v^2 m / (2 F)
# = 2 cm for 5 kg moving and costs the motor 5 N x 6.37 mm = 0.03 N m (at the 0.1 m/s cruise of 2026-11-11, 0.5 cm).
bodies:
  - name: frame
    material: petg_printed
    process:
      kind: printed
      build_direction: [0.0, 0.0, 1.0]
      walls: 2
      infill: 20 percent
    # Two 0.1 m square end posts, 1.2 m tall, carrying rail_x at its ends (x 0.1 m and 0.6 m).
    geometry:
      kind: primitives
      shapes:
        - shape: box
          position: [0.05 m, 0 m, 0.6 m]
          size: [0.1 m, 0.1 m, 1.2 m]
        - shape: box
          position: [0.65 m, 0 m, 0.6 m]
          size: [0.1 m, 0.1 m, 1.2 m]
  - name: rail_x
    material: petg_printed
    process:
      kind: printed
      build_direction: [1.0, 0.0, 0.0]
      walls: 2
      infill: 20 percent
    geometry:
      kind: primitives
      shapes:
        - shape: box
          position: [0.25 m, 0 m, 0 m]
          size: [0.5 m, 0.04 m, 0.04 m]
    flexible:
      section:
        # Placeholder 40 x 40 mm section; rail_section_area and rail_section_second_moment stay open. Length 0.5 m
        # per rail, gantry team 2026-11-11. Both bending axes and fibre distances stated (ruling 58): the placeholder
        # square section, half its 40 mm depth to the outer fibre on each axis.
        area: 1.5e-4 m**2
        second_moment_y: 2e-8 m**4
        second_moment_z: 2e-8 m**4
        fibre_y: 0.02 m
        fibre_z: 0.02 m
        length: 0.5 m
      calibration: ${rail_calibration}
      # Row 17 planning default for the rail end conditions (root, end); owed by the gantry team with the sections.
      # Clamped-clamped at sixteen segments: the chain's clamped error -4 / N^2 is 1.6 percent there, and a
      # calibrated clamped-clamped member below 16 is a build error (rulings 31, 32).
      supports: [clamped, clamped]
      segments: 16
  - name: rail_y
    material: petg_printed
    process:
      kind: printed
      build_direction: [1.0, 0.0, 0.0]
      walls: 2
      infill: 20 percent
    geometry:
      kind: primitives
      shapes:
        - shape: box
          position: [0.25 m, 0 m, 0 m]
          size: [0.5 m, 0.06 m, 0.04 m]
    flexible:
      section:
        # The placeholder 40 x 40 mm section of rail_x, both axes and fibres stated (ruling 58).
        area: 1.5e-4 m**2
        second_moment_y: 2e-8 m**4
        second_moment_z: 2e-8 m**4
        fibre_y: 0.02 m
        fibre_z: 0.02 m
        length: 0.5 m
      calibration: ${rail_calibration}
      # Row 17 planning default for the rail end conditions (root, end); owed by the gantry team with the sections.
      # Pinned-roller at eight segments, inside the 2 percent tolerance from N = 8 (rulings 31, 32).
      supports: [pinned, roller]
      segments: 8
  - name: trolley
    material: petg_printed
    process:
      kind: printed
      build_direction: [0.0, 0.0, 1.0]
      walls: 2
      infill: 20 percent
    geometry:
      kind: primitives
      shapes:
        - shape: box
          position: [0 m, 0 m, 0 m]
          size: [0.1 m, 0.1 m, 0.04 m]
  - name: lift_carriage
    material: petg_printed
    process:
      kind: printed
      build_direction: [0.0, 0.0, 1.0]
      walls: 2
      infill: 20 percent
    geometry:
      kind: primitives
      shapes:
        - shape: box
          position: [0 m, 0 m, 0 m]
          size: [0.08 m, 0.08 m, 0.04 m]
  - name: hook
    material: petg_printed
    process:
      kind: printed
      build_direction: [0.0, 0.0, 1.0]
      walls: 2
      infill: 20 percent
    geometry:
      kind: primitives
      shapes:
        - shape: box
          position: [0 m, 0 m, 0 m]
          size: [0.04 m, 0.04 m, 0.04 m]
  - name: x_motor_shaft
    material: bearing_steel_52100
    process:
      kind: machined
    geometry:
      kind: primitives
      shapes:
        - shape: cylinder
          position: [0 m, 0 m, 0 m]
          radius: 2.5 mm
          length: 20 mm
  - name: y_motor_shaft
    material: bearing_steel_52100
    process:
      kind: machined
    geometry:
      kind: primitives
      shapes:
        - shape: cylinder
          position: [0 m, 0 m, 0 m]
          radius: 2.5 mm
          length: 20 mm
  - name: lift_motor_shaft
    material: bearing_steel_52100
    process:
      kind: machined
    geometry:
      kind: primitives
      shapes:
        - shape: cylinder
          position: [0 m, 0 m, 0 m]
          radius: 2.5 mm
          length: 20 mm
joints:
  - name: frame_mount
    type: fixed
    parent: world
    child: frame
    placement:
      position: [0 m, 0 m, 0 m]
  - name: rail_x_mount
    type: fixed
    parent: frame
    child: rail_x
    placement:
      position: [0.1 m, 0 m, 1.2 m]
  - name: x_axis
    type: prismatic
    parent: rail_x
    child: rail_y
    # rail_y's frame is turned 90 degrees about z (its x along world y), so the travel axis, world x, is its -y.
    placement:
      position: [0 m, 0.1 m, 0.04 m]
      orientation: [0.7071067811865476, 0.0, 0.0, 0.7071067811865476]
    axis: [0.0, -1.0, 0.0]
    linear:
      - limits:
          lower: 0 m
          upper: 0.5 m
        friction: 5 N
        damping: 0 N*s/m
        backlash: 0 m
  - name: y_axis
    type: prismatic
    parent: rail_y
    child: trolley
    # Turned back to world axes; the travel axis is world y.
    placement:
      position: [0 m, 0 m, 0.05 m]
      orientation: [0.7071067811865476, 0.0, 0.0, -0.7071067811865476]
    axis: [0.0, 1.0, 0.0]
    linear:
      - limits:
          lower: 0 m
          upper: 0.5 m
        friction: 5 N
        damping: 0 N*s/m
        backlash: 0 m
  - name: lift_axis
    type: prismatic
    parent: trolley
    child: lift_carriage
    placement:
      position: [0 m, 0 m, -0.65 m]
    axis: [0.0, 0.0, 1.0]
    linear:
      - limits:
          lower: 0 m
          upper: 0.5 m
        friction: 0 N
        damping: 0 N*s/m
        backlash: 0 m
  - name: hook_swing
    type: spherical
    parent: lift_carriage
    child: hook
    placement:
      position: [0 m, 0 m, -0.1 m]
    angular:
      - friction: 0 N*m
        damping: 0 N*m*s/rad
        backlash: 0 rad
      - friction: 0 N*m
        damping: 0 N*m*s/rad
        backlash: 0 rad
      - friction: 0 N*m
        damping: 0 N*m*s/rad
        backlash: 0 rad
  - name: x_motor_spin
    type: revolute
    parent: frame
    child: x_motor_shaft
    placement:
      position: [-0.05 m, -0.1 m, 1.2 m]
    axis: [0.0, 0.0, 1.0]
    angular:
      - friction: 0 N*m
        damping: 0 N*m*s/rad
        backlash: 0 rad
  - name: y_motor_spin
    type: revolute
    parent: rail_y
    child: y_motor_shaft
    placement:
      position: [-0.15 m, 0 m, 0 m]
    axis: [0.0, 0.0, 1.0]
    angular:
      - friction: 0 N*m
        damping: 0 N*m*s/rad
        backlash: 0 rad
  - name: lift_motor_spin
    type: revolute
    parent: trolley
    child: lift_motor_shaft
    placement:
      position: [0 m, 0 m, 0.05 m]
    axis: [0.0, 0.0, 1.0]
    angular:
      - friction: 0 N*m
        damping: 0 N*m*s/rad
        backlash: 0 rad
components:
  - name: x_motor
    type: stepper_behavioral
    part: nema23_class_generic
    mechanical:
      - mount: face
        body: frame
      - mount: shaft
        joint: x_motor_spin
  - name: x_driver
    type: step_dir_driver
    part: step_dir_driver_generic
    signals:
      - name: x_driver.step
        pin: step
        direction: consumes
      - name: x_driver.dir
        pin: dir
        direction: consumes
      - name: x_driver.enable
        pin: enable
        direction: consumes
  - name: x_belt
    type: belt_pulley
    part: gt2_20t_6mm_generic
    mechanical:
      - mount: pulley_bore
        joint: x_motor_spin
      - mount: belt_clamp
        body: rail_y
  - name: y_motor
    type: stepper_behavioral
    part: nema23_class_generic
    mechanical:
      - mount: face
        body: rail_y
      - mount: shaft
        joint: y_motor_spin
  - name: y_driver
    type: step_dir_driver
    part: step_dir_driver_generic
    signals:
      - name: y_driver.step
        pin: step
        direction: consumes
      - name: y_driver.dir
        pin: dir
        direction: consumes
      - name: y_driver.enable
        pin: enable
        direction: consumes
  - name: y_belt
    type: belt_pulley
    part: gt2_20t_6mm_generic
    mechanical:
      - mount: pulley_bore
        joint: y_motor_spin
      - mount: belt_clamp
        body: trolley
  - name: lift_motor
    type: stepper_behavioral
    part: nema23_class_generic
    mechanical:
      - mount: face
        body: trolley
      - mount: shaft
        joint: lift_motor_spin
  - name: lift_driver
    type: step_dir_driver
    part: step_dir_driver_generic
    signals:
      - name: lift_driver.step
        pin: step
        direction: consumes
      - name: lift_driver.dir
        pin: dir
        direction: consumes
      - name: lift_driver.enable
        pin: enable
        direction: consumes
  # The lift is belt-driven like X and Y (gantry team 2026-11-11: no lead screw on any axis), the same placeholder part
  # family (40 mm/turn; efficiency, stiffness and max tension flagged in the catalog); GANTRY_STEPS_PER_M_LIFT is
  # 3200 microsteps / 0.04 m = 80 000. Ruling 26's 8 mm lead is moot for the gantry.
  - name: lift_belt
    type: belt_pulley
    part: gt2_20t_6mm_generic
    mechanical:
      - mount: pulley_bore
        joint: lift_motor_spin
      - mount: belt_clamp
        body: lift_carriage
  - name: x_min_switch
    type: limit_switch
    part: microswitch_generic
    mechanical:
      - mount: body
        body: rail_x
    signals:
      - name: x_min_switch.out
        pin: out
        direction: emits
    senses:
      joint: x_axis
      position: 0 m
      actuate_above: false
  - name: x_max_switch
    type: limit_switch
    part: microswitch_generic
    mechanical:
      - mount: body
        body: rail_x
    signals:
      - name: x_max_switch.out
        pin: out
        direction: emits
    # Position: the 0.5 m workspace (joint upper limit), gantry team 2026-11-11; the switch's own placement awaits CAD.
    senses:
      joint: x_axis
      position: 0.5 m
      actuate_above: true
  - name: y_min_switch
    type: limit_switch
    part: microswitch_generic
    mechanical:
      - mount: body
        body: rail_y
    signals:
      - name: y_min_switch.out
        pin: out
        direction: emits
    senses:
      joint: y_axis
      position: 0 m
      actuate_above: false
  - name: y_max_switch
    type: limit_switch
    part: microswitch_generic
    mechanical:
      - mount: body
        body: rail_y
    signals:
      - name: y_max_switch.out
        pin: out
        direction: emits
    # Position: the 0.5 m workspace (joint upper limit), gantry team 2026-11-11; the switch's own placement awaits CAD.
    senses:
      joint: y_axis
      position: 0.5 m
      actuate_above: true
  - name: lift_min_switch
    type: limit_switch
    part: microswitch_generic
    mechanical:
      - mount: body
        body: trolley
    signals:
      - name: lift_min_switch.out
        pin: out
        direction: emits
    senses:
      joint: lift_axis
      position: 0 m
      actuate_above: false
  - name: lift_max_switch
    type: limit_switch
    part: microswitch_generic
    mechanical:
      - mount: body
        body: trolley
    signals:
      - name: lift_max_switch.out
        pin: out
        direction: emits
    # PLACEHOLDER position: the axis travel of this draft (joint upper limit), until the gantry team's CAD.
    senses:
      joint: lift_axis
      position: 0.5 m
      actuate_above: true
  # Frame-side linear encoders on the axis joints (ruling 32); 60000 counts per metre matches GANTRY_COUNTS_PER_M_*.
  - name: x_encoder
    type: linear_encoder
    part: linear_encoder_generic
    mechanical:
      - mount: flange
        body: ${encoder_placement}
    signals:
      - name: x_encoder.channel_a
        pin: channel_a
        direction: emits
      - name: x_encoder.channel_b
        pin: channel_b
        direction: emits
    senses:
      joint: x_axis
  - name: y_encoder
    type: linear_encoder
    part: linear_encoder_generic
    mechanical:
      - mount: flange
        body: ${encoder_placement}
    signals:
      - name: y_encoder.channel_a
        pin: channel_a
        direction: emits
      - name: y_encoder.channel_b
        pin: channel_b
        direction: emits
    senses:
      joint: y_axis
  - name: lift_encoder
    type: linear_encoder
    part: linear_encoder_generic
    mechanical:
      - mount: flange
        body: ${encoder_placement}
    signals:
      - name: lift_encoder.channel_a
        pin: channel_a
        direction: emits
      - name: lift_encoder.channel_b
        pin: channel_b
        direction: emits
    senses:
      joint: lift_axis
  # The hook as the end effector carrying the case payload (LIB-031); its mass is the hook body's, capacity placeholder.
  - name: hook_effector
    type: end_effector
    part: hook_generic
    mechanical:
      - mount: attach
        body: hook
  # PLACEHOLDER load cell chain (open parameter load_cell_type): no weight sensor declared by the gantry team
  # (2026-11-11); G5 and G6 need one or another overload detection. The cell reads the reaction at the case payload's
  # fixed joint to the hook (DES-043 senses.joint_reaction, ruling 24); the amplifier gain 241.8 makes 1 kg read 600
  # ADC counts on the placeholder chip (2e-3 V/kg x 241.8 x 4096 / 3.3 V), so the 5.5 kg overweight payload (3300
  # counts) stays inside the 12-bit range, which at 1000 counts/kg ended at 4.1 kg, under the 5.216 kg limit.
  - name: load_cell
    type: load_cell
    part: load_cell_5kg_generic
    mechanical:
      - mount: body
        body: hook
    senses:
      joint_reaction: payload
  - name: load_amp
    type: load_cell_amplifier
    part: load_cell_amplifier_generic
    # PLACEHOLDER bandwidth 2 Hz (ruling 35): the lift-start force transient must not read as an overload; the gantry
    # team owes the real front end or overload filtering.
    overrides:
      gain: "241.8"
      bandwidth: "2 Hz"

    mechanical:
      - mount: board
        body: trolley
    signals:
      - name: load_amp.out
        pin: out
        direction: emits
  # PLACEHOLDER lift brake (open parameter power_loss_hold): a spring-applied brake on the lift motor shaft (a motor
  # brake, ruling 23); its coil is on the motor rail, so a power loss or E-stop engages it.
  - name: lift_brake
    type: brake
    part: brake_24v_generic
    mechanical:
      - mount: body
        body: trolley
    signals:
      - name: lift_brake.release
        pin: release
        direction: consumes
    acts_on:
      joint: lift_motor_spin
  - name: motor_supply
    type: power_supply
    part: psu_24v_10a_generic
  # PLACEHOLDER logic supply (open parameter logic_supply): the generic supply part set to 3.3 V.
  - name: logic_psu
    type: power_supply
    part: psu_24v_10a_generic
    overrides:
      output_voltage: 3.3 V
      max_current: 1 A
  # PLACEHOLDER relay reset (round 4 ruling 25): no manual reset, the motor rail returns when the E-stop loop closes;
  # the firmware's `reset` message gates motion after an E-stop (FW-024). The real relay's arrangement is owed.
  - name: estop
    type: estop_relay
    part: estop_relay_24v_generic
    overrides:
      manual_reset: false
    signals:
      - name: estop.status
        pin: status
        direction: emits
  - name: watchdog
    type: watchdog
    part: watchdog_24v_generic
    signals:
      - name: watchdog.heartbeat
        pin: heartbeat
        direction: consumes
  - name: operator_link
    type: uart_link
    part: uart_link_115200_generic
    signals:
      - name: operator_link.uart_tx
        pin: uart_tx
        direction: consumes
      - name: operator_link.uart_rx
        pin: uart_rx
        direction: emits
wiring:
  - source: motor_supply.v_out
    destination: estop.contact_in
  - source: estop.contact_out
    destination: watchdog.contact_in
  - source: watchdog.contact_out
    destination: x_driver.vmot
  - source: watchdog.contact_out
    destination: y_driver.vmot
  - source: watchdog.contact_out
    destination: lift_driver.vmot
  - source: motor_supply.gnd
    destination: watchdog.gnd
  - source: motor_supply.gnd
    destination: x_driver.gnd
  - source: motor_supply.gnd
    destination: y_driver.gnd
  - source: motor_supply.gnd
    destination: lift_driver.gnd
  - source: x_driver.coil_a
    destination: x_motor.coil_a
  - source: x_driver.coil_b
    destination: x_motor.coil_b
  - source: y_driver.coil_a
    destination: y_motor.coil_a
  - source: y_driver.coil_b
    destination: y_motor.coil_b
  - source: lift_driver.coil_a
    destination: lift_motor.coil_a
  - source: lift_driver.coil_b
    destination: lift_motor.coil_b
  - source: logic_psu.v_out
    destination: x_encoder.vcc
  - source: logic_psu.gnd
    destination: x_encoder.gnd
  - source: logic_psu.v_out
    destination: y_encoder.vcc
  - source: logic_psu.gnd
    destination: y_encoder.gnd
  - source: logic_psu.v_out
    destination: lift_encoder.vcc
  - source: logic_psu.gnd
    destination: lift_encoder.gnd
  - source: load_cell.signal
    destination: load_amp.signal_in
  - source: logic_psu.v_out
    destination: load_cell.excitation
  - source: logic_psu.gnd
    destination: load_cell.ground
  - source: logic_psu.v_out
    destination: load_amp.vcc
  - source: logic_psu.gnd
    destination: load_amp.ground
  - source: watchdog.contact_out
    destination: lift_brake.vcc
  - source: motor_supply.gnd
    destination: lift_brake.ground
pin_bindings:
  - signal: x_driver.step
    pin: PA0
    mode: pulse_output
  - signal: x_driver.dir
    pin: PA1
    mode: digital_output
  - signal: x_driver.enable
    pin: PA2
    mode: digital_output
  - signal: y_driver.step
    pin: PA3
    mode: pulse_output
  - signal: y_driver.dir
    pin: PA4
    mode: digital_output
  - signal: y_driver.enable
    pin: PA5
    mode: digital_output
  - signal: lift_driver.step
    pin: PA6
    mode: pulse_output
  - signal: lift_driver.dir
    pin: PA7
    mode: digital_output
  - signal: lift_driver.enable
    pin: PA8
    mode: digital_output
  - signal: x_min_switch.out
    pin: PB0
    mode: digital_input
  - signal: x_max_switch.out
    pin: PB1
    mode: digital_input
  - signal: y_min_switch.out
    pin: PB2
    mode: digital_input
  - signal: y_max_switch.out
    pin: PB3
    mode: digital_input
  - signal: lift_min_switch.out
    pin: PB4
    mode: digital_input
  - signal: lift_max_switch.out
    pin: PB5
    mode: digital_input
  - signal: x_encoder.channel_a
    pin: PC0
    mode: counter_input
  - signal: x_encoder.channel_b
    pin: PC1
    mode: counter_input
  - signal: y_encoder.channel_a
    pin: PC2
    mode: counter_input
  - signal: y_encoder.channel_b
    pin: PC3
    mode: counter_input
  - signal: lift_encoder.channel_a
    pin: PC4
    mode: counter_input
  - signal: lift_encoder.channel_b
    pin: PC5
    mode: counter_input
  - signal: watchdog.heartbeat
    pin: PB6
    mode: digital_output
  - signal: operator_link.uart_tx
    pin: PA9
    mode: uart_tx
  - signal: operator_link.uart_rx
    pin: PA10
    mode: uart_rx
  - signal: load_amp.out
    pin: PA11
    mode: adc_input
  - signal: estop.status
    pin: PB7
    mode: digital_input
  - signal: lift_brake.release
    pin: PB8
    mode: digital_output
power:
  rails:
    - name: motor_power
      supply: motor_supply
      gated_by: [estop, watchdog]
      consumers: [x_driver, y_driver, lift_driver, lift_brake]
    - name: logic
      supply: ${logic_supply}
      consumers: [x_encoder, y_encoder, lift_encoder, load_cell, load_amp]
  controller_rail: logic
firmware:
  # Application target mechsim_fw_gantry in the firmware tree (DES-040). Codes: firmware/app/gantry/gantry_config.h.
  path: firmware
  chip: stm32_placeholder
  tick_rate: 1 kHz
  state_codes:
    1: not_homed
    2: homing
    3: ready
    4: moving
    5: fault
  fault_codes:
    0: none
    1: not_homed
    2: outside_workspace
    3: busy
    4: malformed
    5: queue_full
    6: in_fault
    7: homing_failed
    8: event_overflow
    9: tx_overflow
    10: overload
    11: estop
    12: encoder_mismatch
    13: limit_trip
    14: nothing_to_reset
  # event_log codes recorded as events (gantry_config.h GANTRY_EVENT_*), each with its argument kind (round 4 ruling 28):
  # an axis reads as that step channel's driver instance (motion_start, motion_end: FW-028), a fault or state code as
  # its name (state_change packs (from << 8) | to, read from>to).
  event_codes:
    1: {name: state_change, argument: state}
    3: {name: refused, argument: fault}
    4: {name: fault_latched, argument: fault}
    6: {name: motion_start, argument: axis}
    7: {name: motion_end, argument: axis}
operator_messages:
  - name: target
    label: target (x, y)
    source: operator
    destination: controller
    fields:
      - name: x
        dimension: "[length]"
      - name: y
        dimension: "[length]"
  - name: home
    label: home
    source: operator
    destination: controller
  # Lift the hook to z, metres above the lift home (min) switch; lowering is a lower z (round 4 ruling 8).
  - name: lift
    label: lift
    source: operator
    destination: controller
    fields:
      - name: z
        dimension: "[length]"
  # Clear a latched E-stop fault once the motor rail is live; the controller returns to not_homed (round 4 ruling 7).
  - name: reset
    label: reset
    source: operator
    destination: controller
  - name: current_position
    label: current position
    source: controller
    destination: operator
    fields:
      - name: x
        dimension: "[length]"
      - name: y
        dimension: "[length]"
  # The controller's status after every state change, refusal and fault: its state and fault codes (firmware
  # state_codes and fault_codes).
  - name: status
    label: ready / fault
    source: controller
    destination: operator
    fields:
      - name: state
        dimension: dimensionless
      - name: fault
        dimension: dimensionless
structural:
  design_load:
    rated_load: ${rated_load}
    allowance: 15 percent
    note: Rated load plus 15 percent for hoist and trolley weight (Gorbel work station crane rule).
  accuracy_target: 1 cm
  deflection_target: ${deflection_target_mode}
  minimum_safety_factor: ${minimum_safety_factor}
# The payload rope (ADR 0016, ruling 2): one PLACEHOLDER 0.3 m steel rope from the hook to the case payload. Its load
# end is the case payload, placed at run time (BLD-032): on the native adapter the run hangs the payload on the rope
# (top face centre, the rope's rest length below the hook point); the mujoco bridge models no rope and keeps the
# payload fixed to the hook, swinging on hook_swing, with an approximation line saying so.
ropes:
  - name: payload_rope
    part: rope_3mm_steel_generic
    from:
      body: hook
      point: [0 m, 0 m, -0.02 m]
    to:
      payload: payload
    segments: 8
