# Gantry reference design (DES-025), draft. Values the requirements doc gives are set: 1 cm position accuracy, 1 kHz
# control tick (C4), rated load plus 15 percent design-load rule. Physics stand-ins are marked PLACEHOLDER; everything
# else is a ${name} open parameter owed by the gantry team. Every open parameter carries a default (DES-044), a
# PLACEHOLDER UNTIL THE GANTRY TEAM RULES: the run uses it when neither the case nor --set gives a value. Kinematic
# chain: frame on the world; rail_x fixed on the frame; rail_y travels along x on rail_x; the trolley travels along y
# on rail_y; the lift carriage travels along z on the trolley (lead screw); the hook hangs from the lift carriage. Each axis motor drives a shaft body on a revolute joint. MCU pin names come from the
# placeholder chip chips/stm32_placeholder until the STM32 part is selected. The controller heartbeat is a digital
# output pin bound to the watchdog's heartbeat port; the watchdog and the E-stop relay both gate motor power.
name: gantry
version: 0.1.0
source_hash: unset
status: draft
description: Overhead X-Y gantry with a lead-screw hook lift; the first reference design.
open_parameters:
  - name: workspace_x
    dimension: "[length]"
    owed_by: gantry team
    note: X travel of the rectangular workspace; requirements doc says not set.
    default: "1 m"
  - name: workspace_y
    dimension: "[length]"
    owed_by: gantry team
    note: Y travel of the rectangular workspace; requirements doc says not set.
    default: "0.8 m"
  - name: lift_travel
    dimension: "[length]"
    owed_by: gantry team
    note: Vertical travel of the hook lift.
    default: "0.5 m"
  - name: rated_load
    dimension: "[mass]"
    owed_by: gantry team
    note: Requirements doc says a few pounds; the walkthrough used 3 kg; exact value not set.
    default: "3 kg"
  - name: cad_model
    dimension: choice
    owed_by: gantry team
    note: Body geometry, mass properties, joint placements and motor shaft axes come from the Fusion 360 model (row 23).
    default: "placeholder_primitives"
  - name: body_materials
    dimension: choice
    owed_by: gantry team
    note: Material and process of the frame, trolley, lift carriage, hook and motor shafts.
    default: "aluminium_6063_t5_extrusion"
  - name: rail_section_area
    dimension: "[length] ** 2"
    owed_by: gantry team
    note: Rail extrusion section area (row 17 planning default, rails flexible with extrusion sections).
    default: "1.5e-4 m**2"
  - name: rail_section_second_moment
    dimension: "[length] ** 4"
    owed_by: gantry team
    note: Rail extrusion section second moment of area.
    default: "2e-8 m**4"
  - name: rail_calibration
    dimension: choice
    owed_by: gantry team
    note: Known deflection and first natural frequency each rail is calibrated to, from hand calculation or FEA.
    default:
      source: hand
      load: 100 N
      deflection: 1 mm
      first_natural_frequency: 50 Hz
  - name: encoder_placement
    dimension: choice
    owed_by: gantry team
    note: Motor shaft or axis side (row 14); both supported.
    default: "frame"
  - name: load_cell_type
    dimension: choice
    owed_by: gantry team
    note: >-
      Weight sensor part; PLACEHOLDER load_cell_5kg_generic on the hook reading the case payload, through load_amp
      (gain 403 so the firmware's 1000 counts per kg holds with the 12-bit 3.3 V placeholder ADC).
    default: "load_cell_5kg_generic"
  - name: deflection_target_mode
    dimension: choice
    owed_by: gantry team
    note: Whether the 1 cm deflection target is static or dynamic (row 17; planning default static, dynamic reported).
    default: "static"
  - name: minimum_safety_factor
    dimension: dimensionless
    owed_by: gantry team
    note: Minimum structural safety factor (ADR 0009); whether it lives in the design or the test case is also open.
    default: "2"
  - name: swing_limit_angle
    dimension: dimensionless
    owed_by: gantry team
    note: Limit for load swing angle.
    default: "0.1"
  - name: swing_settle_time
    dimension: "[time]"
    owed_by: gantry team
    note: Limit for load swing settle time.
    default: "5 s"
  - name: new_target_policy
    dimension: choice
    owed_by: gantry team
    note: New target during a move, cancel and replace or queue.
    default: "reject"
  - name: lift_while_moving_policy
    dimension: choice
    owed_by: gantry team
    note: Whether lifting is allowed while moving.
    default: "reject"
  - name: power_loss_hold
    dimension: choice
    owed_by: gantry team
    note: >-
      How the gantry holds its load when power is cut, brake or self-locking lead screw. PLACEHOLDER brake (round 4
      ruling 1): lift_brake, a spring-applied brake_24v_generic on the motor rail, holds the lift whenever the coil
      is unpowered; the MuJoCo bridge refuses a self-locking screw.
    default: "brake"
  - name: stm32_part
    dimension: choice
    owed_by: gantry team
    note: >-
      STM32 chip, not selected; firmware.chip names chips/stm32_placeholder meanwhile, and the selected part replaces
      it with its own chip definition.
    default: "stm32_placeholder"
  - name: logic_supply
    dimension: choice
    owed_by: gantry team
    note: Supply of the controller's logic rail.
    default: "logic_psu"
  - name: ambient_temperature
    dimension: "[temperature]"
    owed_by: gantry team
    note: Ambient temperature of the operating environment.
    default: "298.15 K"
  - name: contact_stiffness
    dimension: "[mass] / [time] ** 2"
    owed_by: gantry team
    note: Default normal contact stiffness (DES-042, ADR 0002).
    default: "100000 N/m"
  - name: contact_damping
    dimension: "[mass] / [time]"
    owed_by: gantry team
    note: Default normal contact damping.
    default: "1000 N*s/m"
  - name: contact_friction
    dimension: dimensionless
    owed_by: gantry team
    note: Default Coulomb friction coefficient.
    default: "0.5"
  - name: axis_friction
    dimension: "[mass] * [length] / [time] ** 2"
    owed_by: gantry team
    note: Friction force of each linear axis.
    default: "0 N"
  - name: axis_damping
    dimension: "[mass] / [time]"
    owed_by: gantry team
    note: Viscous damping of each linear axis.
    default: "0 N*s/m"
  - name: axis_backlash
    dimension: "[length]"
    owed_by: gantry team
    note: Backlash of each linear axis.
    default: "0 m"
  - name: shaft_friction
    dimension: "[mass] * [length] ** 2 / [time] ** 2"
    owed_by: gantry team
    note: Friction torque of each motor shaft bearing.
    default: "0 N*m"
  - name: shaft_damping
    dimension: "[mass] * [length] ** 2 / [time]"
    owed_by: gantry team
    note: Viscous damping of each motor shaft bearing.
    default: "0 N*m*s"
  - name: shaft_backlash
    dimension: dimensionless
    owed_by: gantry team
    note: Angular backlash of each motor shaft.
    default: "0"
  - name: hook_friction
    dimension: "[mass] * [length] ** 2 / [time] ** 2"
    owed_by: gantry team
    note: Friction torque of the hook suspension.
    default: "0 N*m"
  - name: hook_damping
    dimension: "[mass] * [length] ** 2 / [time]"
    owed_by: gantry team
    note: Viscous damping of the hook suspension.
    default: "0 N*m*s"
  - name: hook_backlash
    dimension: dimensionless
    owed_by: gantry team
    note: Angular backlash of the hook suspension.
    default: "0"
environment:
  gravity: [0 m/s**2, 0 m/s**2, -9.81 m/s**2]
  ambient_temperature: ${ambient_temperature}
  contact:
    # PLACEHOLDER contact parameters; contact_stiffness, contact_damping and contact_friction stay open.
    default:
      stiffness: 100000 N/m
      damping: 1000 N*s/m
      friction: "0.5"
    # The frame is fixed to the world at the origin, so the floor is the world x-y plane.
    floor:
      normal: [0.0, 0.0, 1.0]
      offset: 0 m
# PLACEHOLDER GEOMETRY until the gantry team's CAD arrives (DES open parameter cad_model).
# Every body below is a box or cylinder of aluminium 6063-T5 with mass properties computed from it, and every joint
# placement, motor axis, joint friction, damping and backlash, contact parameter and rail section is a stand-in
# chosen only so the rigid milestone 1 gantry builds; none of it is gantry data. Placeholder sizes: workspace x 1.0 m
# (rail_x 1.2 m long), workspace y 0.8 m (rail_y 1.0 m long), lift travel 0.5 m, rail_x 1.0 m above the floor.
# Reference configuration (all joint coordinates zero), world positions of the body frames: frame (0, 0, 0),
# rail_x (0, 0, 1), rail_y (0.1, 0, 1.04), trolley (0.1, 0.1, 1.09), lift_carriage (0.1, 0.1, 0.44), hook
# (0.1, 0.1, 0.34), x_motor_shaft (-0.05, -0.1, 1), y_motor_shaft (0.1, -0.05, 1.04), lift_motor_shaft
# (0.1, 0.1, 1.14); no two bodies not joined to each other overlap there (BLD-022). The lift carriage hangs 0.65 m
# below the trolley so the full 0.5 m lift travel keeps its top (0.96 m) below rail_x (1.02 m); at 0.3 m it struck
# rail_x at 0.21 m of travel (M2-X3). x_axis and y_axis carry 5 N of placeholder Coulomb friction (M2-X3): without it
# an axis cut off mid-move by the E-stop coasted at 0.2 m/s to its far limit (G7); 5 N stops it within v^2 m / (2 F)
# = 2 cm for 5 kg moving and costs the motor 5 N x 6.37 mm = 0.03 N m.
bodies:
  - name: frame
    material: aluminium_6063_t5_extrusion
    process:
      kind: extrusion
    # Two 0.1 m square end posts, 1 m tall, carrying rail_x.
    geometry:
      kind: primitives
      shapes:
        - shape: box
          position: [-0.05 m, 0 m, 0.5 m]
          size: [0.1 m, 0.1 m, 1 m]
        - shape: box
          position: [1.25 m, 0 m, 0.5 m]
          size: [0.1 m, 0.1 m, 1 m]
  - name: rail_x
    material: aluminium_6063_t5_extrusion
    process:
      kind: extrusion
    geometry:
      kind: primitives
      shapes:
        - shape: box
          position: [0.6 m, 0 m, 0 m]
          size: [1.2 m, 0.04 m, 0.04 m]
    flexible:
      section:
        # Placeholder 40 x 40 mm extrusion section; rail_section_area and rail_section_second_moment stay open.
        area: 1.5e-4 m**2
        second_moment: 2e-8 m**4
        length: 1.2 m
      calibration: ${rail_calibration}
      # Row 17 planning default for the rail end conditions (root, end); owed by the gantry team with the sections.
      # Clamped-clamped has no lumped beam yet: the gantry builds with rigid_members until milestone 3.
      supports: [clamped, clamped]
  - name: rail_y
    material: aluminium_6063_t5_extrusion
    process:
      kind: extrusion
    geometry:
      kind: primitives
      shapes:
        - shape: box
          position: [0 m, 0.5 m, 0 m]
          size: [0.06 m, 1 m, 0.04 m]
    flexible:
      section:
        area: 1.5e-4 m**2
        second_moment: 2e-8 m**4
        length: 1 m
      calibration: ${rail_calibration}
      # Row 17 planning default for the rail end conditions (root, end); owed by the gantry team with the sections.
      supports: [pinned, roller]
  - name: trolley
    material: aluminium_6063_t5_extrusion
    process:
      kind: extrusion
    geometry:
      kind: primitives
      shapes:
        - shape: box
          position: [0 m, 0 m, 0 m]
          size: [0.1 m, 0.1 m, 0.04 m]
  - name: lift_carriage
    material: aluminium_6063_t5_extrusion
    process:
      kind: extrusion
    geometry:
      kind: primitives
      shapes:
        - shape: box
          position: [0 m, 0 m, 0 m]
          size: [0.08 m, 0.08 m, 0.04 m]
  - name: hook
    material: aluminium_6063_t5_extrusion
    process:
      kind: extrusion
    geometry:
      kind: primitives
      shapes:
        - shape: box
          position: [0 m, 0 m, 0 m]
          size: [0.04 m, 0.04 m, 0.04 m]
  - name: x_motor_shaft
    material: aluminium_6063_t5_extrusion
    process:
      kind: extrusion
    geometry:
      kind: primitives
      shapes:
        - shape: cylinder
          position: [0 m, 0 m, 0 m]
          radius: 2.5 mm
          length: 20 mm
  - name: y_motor_shaft
    material: aluminium_6063_t5_extrusion
    process:
      kind: extrusion
    geometry:
      kind: primitives
      shapes:
        - shape: cylinder
          position: [0 m, 0 m, 0 m]
          radius: 2.5 mm
          length: 20 mm
  - name: lift_motor_shaft
    material: aluminium_6063_t5_extrusion
    process:
      kind: extrusion
    geometry:
      kind: primitives
      shapes:
        - shape: cylinder
          position: [0 m, 0 m, 0 m]
          radius: 2.5 mm
          length: 20 mm
joints:
  - name: frame_mount
    type: fixed
    parent: world
    child: frame
    placement:
      position: [0 m, 0 m, 0 m]
  - name: rail_x_mount
    type: fixed
    parent: frame
    child: rail_x
    placement:
      position: [0 m, 0 m, 1 m]
  - name: x_axis
    type: prismatic
    parent: rail_x
    child: rail_y
    placement:
      position: [0.1 m, 0 m, 0.04 m]
    axis: [1.0, 0.0, 0.0]
    linear:
      - limits:
          lower: 0 m
          upper: 1 m
        friction: 5 N
        damping: 0 N*s/m
        backlash: 0 m
  - name: y_axis
    type: prismatic
    parent: rail_y
    child: trolley
    placement:
      position: [0 m, 0.1 m, 0.05 m]
    axis: [0.0, 1.0, 0.0]
    linear:
      - limits:
          lower: 0 m
          upper: 0.8 m
        friction: 5 N
        damping: 0 N*s/m
        backlash: 0 m
  - name: lift_axis
    type: prismatic
    parent: trolley
    child: lift_carriage
    placement:
      position: [0 m, 0 m, -0.65 m]
    axis: [0.0, 0.0, 1.0]
    linear:
      - limits:
          lower: 0 m
          upper: 0.5 m
        friction: 0 N
        damping: 0 N*s/m
        backlash: 0 m
  - name: hook_swing
    type: spherical
    parent: lift_carriage
    child: hook
    placement:
      position: [0 m, 0 m, -0.1 m]
    angular:
      - friction: 0 N*m
        damping: 0 N*m*s/rad
        backlash: 0 rad
      - friction: 0 N*m
        damping: 0 N*m*s/rad
        backlash: 0 rad
      - friction: 0 N*m
        damping: 0 N*m*s/rad
        backlash: 0 rad
  - name: x_motor_spin
    type: revolute
    parent: frame
    child: x_motor_shaft
    placement:
      position: [-0.05 m, -0.1 m, 1 m]
    axis: [0.0, 0.0, 1.0]
    angular:
      - friction: 0 N*m
        damping: 0 N*m*s/rad
        backlash: 0 rad
  - name: y_motor_spin
    type: revolute
    parent: rail_y
    child: y_motor_shaft
    placement:
      position: [0 m, -0.05 m, 0 m]
    axis: [0.0, 0.0, 1.0]
    angular:
      - friction: 0 N*m
        damping: 0 N*m*s/rad
        backlash: 0 rad
  - name: lift_motor_spin
    type: revolute
    parent: trolley
    child: lift_motor_shaft
    placement:
      position: [0 m, 0 m, 0.05 m]
    axis: [0.0, 0.0, 1.0]
    angular:
      - friction: 0 N*m
        damping: 0 N*m*s/rad
        backlash: 0 rad
components:
  - name: x_motor
    type: stepper_behavioral
    part: nema17_class_generic
    mechanical:
      - mount: face
        body: frame
      - mount: shaft
        joint: x_motor_spin
  - name: x_driver
    type: step_dir_driver
    part: step_dir_driver_generic
    signals:
      - name: x_driver.step
        pin: step
        direction: consumes
      - name: x_driver.dir
        pin: dir
        direction: consumes
      - name: x_driver.enable
        pin: enable
        direction: consumes
  - name: x_belt
    type: belt_pulley
    part: gt2_20t_6mm_generic
    mechanical:
      - mount: pulley_bore
        joint: x_motor_spin
      - mount: belt_clamp
        body: rail_y
  - name: y_motor
    type: stepper_behavioral
    part: nema17_class_generic
    mechanical:
      - mount: face
        body: rail_y
      - mount: shaft
        joint: y_motor_spin
  - name: y_driver
    type: step_dir_driver
    part: step_dir_driver_generic
    signals:
      - name: y_driver.step
        pin: step
        direction: consumes
      - name: y_driver.dir
        pin: dir
        direction: consumes
      - name: y_driver.enable
        pin: enable
        direction: consumes
  - name: y_belt
    type: belt_pulley
    part: gt2_20t_6mm_generic
    mechanical:
      - mount: pulley_bore
        joint: y_motor_spin
      - mount: belt_clamp
        body: trolley
  - name: lift_motor
    type: stepper_behavioral
    part: nema17_class_generic
    mechanical:
      - mount: face
        body: trolley
      - mount: shaft
        joint: lift_motor_spin
  - name: lift_driver
    type: step_dir_driver
    part: step_dir_driver_generic
    signals:
      - name: lift_driver.step
        pin: step
        direction: consumes
      - name: lift_driver.dir
        pin: dir
        direction: consumes
      - name: lift_driver.enable
        pin: enable
        direction: consumes
  - name: lift_screw
    type: lead_screw
    part: tr8x8_generic
    # Milestone 1: the MuJoCo bridge refuses backlash until milestone 2 (PHY-006), so the design zeroes it here; the
    # catalog part keeps its 0.1 mm. PLACEHOLDER lead (ratio) 40 mm/turn, matched by the firmware's per-axis
    # GANTRY_STEPS_PER_M_LIFT (80 000): with the part's 8 mm lead the lift held by its stepper at the lower joint limit
    # diverges on the bridge (M2-X2 open issue); the 8 mm lead returns with 400 000 steps/m when that is fixed.
    overrides:
      backlash: 0 mm
      ratio: 40 mm/turn
    mechanical:
      - mount: drive_end
        joint: lift_motor_spin
      - mount: nut
        body: lift_carriage
  - name: x_min_switch
    type: limit_switch
    part: microswitch_generic
    mechanical:
      - mount: body
        body: rail_x
    signals:
      - name: x_min_switch.out
        pin: out
        direction: emits
    senses:
      joint: x_axis
      position: 0 m
      actuate_above: false
  - name: x_max_switch
    type: limit_switch
    part: microswitch_generic
    mechanical:
      - mount: body
        body: rail_x
    signals:
      - name: x_max_switch.out
        pin: out
        direction: emits
    # PLACEHOLDER position: the axis travel of this draft (joint upper limit), until the gantry team's CAD.
    senses:
      joint: x_axis
      position: 1 m
      actuate_above: true
  - name: y_min_switch
    type: limit_switch
    part: microswitch_generic
    mechanical:
      - mount: body
        body: rail_y
    signals:
      - name: y_min_switch.out
        pin: out
        direction: emits
    senses:
      joint: y_axis
      position: 0 m
      actuate_above: false
  - name: y_max_switch
    type: limit_switch
    part: microswitch_generic
    mechanical:
      - mount: body
        body: rail_y
    signals:
      - name: y_max_switch.out
        pin: out
        direction: emits
    # PLACEHOLDER position: the axis travel of this draft (joint upper limit), until the gantry team's CAD.
    senses:
      joint: y_axis
      position: 0.8 m
      actuate_above: true
  - name: lift_min_switch
    type: limit_switch
    part: microswitch_generic
    mechanical:
      - mount: body
        body: trolley
    signals:
      - name: lift_min_switch.out
        pin: out
        direction: emits
    senses:
      joint: lift_axis
      position: 0 m
      actuate_above: false
  - name: lift_max_switch
    type: limit_switch
    part: microswitch_generic
    mechanical:
      - mount: body
        body: trolley
    signals:
      - name: lift_max_switch.out
        pin: out
        direction: emits
    # PLACEHOLDER position: the axis travel of this draft (joint upper limit), until the gantry team's CAD.
    senses:
      joint: lift_axis
      position: 0.5 m
      actuate_above: true
  - name: x_encoder
    type: incremental_encoder
    part: encoder_600ppr_generic
    mechanical:
      - mount: flange
        body: ${encoder_placement}
    signals:
      - name: x_encoder.channel_a
        pin: channel_a
        direction: emits
      - name: x_encoder.channel_b
        pin: channel_b
        direction: emits
    senses:
      joint: x_motor_spin
  - name: y_encoder
    type: incremental_encoder
    part: encoder_600ppr_generic
    mechanical:
      - mount: flange
        body: ${encoder_placement}
    signals:
      - name: y_encoder.channel_a
        pin: channel_a
        direction: emits
      - name: y_encoder.channel_b
        pin: channel_b
        direction: emits
    senses:
      joint: y_motor_spin
  - name: lift_encoder
    type: incremental_encoder
    part: encoder_600ppr_generic
    mechanical:
      - mount: flange
        body: ${encoder_placement}
    signals:
      - name: lift_encoder.channel_a
        pin: channel_a
        direction: emits
      - name: lift_encoder.channel_b
        pin: channel_b
        direction: emits
    senses:
      joint: lift_motor_spin
  # PLACEHOLDER load cell chain (open parameter load_cell_type): the cell reads the reaction at the case payload's
  # fixed joint to the hook (DES-043 senses.joint_reaction, ruling 24); the amplifier gain is set so 1 kg reads 1000
  # ADC counts on the placeholder chip.
  - name: load_cell
    type: load_cell
    part: load_cell_5kg_generic
    mechanical:
      - mount: body
        body: hook
    senses:
      joint_reaction: payload
  - name: load_amp
    type: load_cell_amplifier
    part: load_cell_amplifier_generic
    overrides:
      gain: "403"
    mechanical:
      - mount: board
        body: trolley
    signals:
      - name: load_amp.out
        pin: out
        direction: emits
  # PLACEHOLDER lift brake (open parameter power_loss_hold): a spring-applied brake on the lift motor shaft (a motor
  # brake, ruling 23); its coil is on the motor rail, so a power loss or E-stop engages it.
  - name: lift_brake
    type: brake
    part: brake_24v_generic
    mechanical:
      - mount: body
        body: trolley
    signals:
      - name: lift_brake.release
        pin: release
        direction: consumes
    acts_on:
      joint: lift_motor_spin
  - name: motor_supply
    type: power_supply
    part: psu_24v_10a_generic
  # PLACEHOLDER logic supply (open parameter logic_supply): the generic supply part set to 3.3 V.
  - name: logic_psu
    type: power_supply
    part: psu_24v_10a_generic
    overrides:
      output_voltage: 3.3 V
      max_current: 1 A
  # PLACEHOLDER relay reset (round 4 ruling 25): no manual reset, the motor rail returns when the E-stop loop closes;
  # the firmware's `reset` message gates motion after an E-stop (FW-024). The real relay's arrangement is owed.
  - name: estop
    type: estop_relay
    part: estop_relay_24v_generic
    overrides:
      manual_reset: false
    signals:
      - name: estop.status
        pin: status
        direction: emits
  - name: watchdog
    type: watchdog
    part: watchdog_24v_generic
    signals:
      - name: watchdog.heartbeat
        pin: heartbeat
        direction: consumes
  - name: operator_link
    type: uart_link
    part: uart_link_115200_generic
    signals:
      - name: operator_link.uart_tx
        pin: uart_tx
        direction: consumes
      - name: operator_link.uart_rx
        pin: uart_rx
        direction: emits
wiring:
  - source: motor_supply.v_out
    destination: estop.contact_in
  - source: estop.contact_out
